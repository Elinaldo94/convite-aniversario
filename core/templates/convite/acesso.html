{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar no Convite - Matheus Emanuel</title>

    <!-- Bootstrap CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <!-- Seu arquivo CSS (onde devem ficar todas as regras de estilo) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body class="body-login">
    <div class="container container-login">
      <div class="card card-login p-4">
        <div class="text-center topo-login">
          <h1 class="titulo-infantil">Matheus Emanuel</h1>
          <p class="subtitulo-infantil">2 aninhos de muita alegria!</p>
          <p class="instrucoes-login">
            Digite a senha contida no seu convite de papel para confirmar sua
            presença.
          </p>
        </div>

        <form method="POST" id="formLogin">
          {% csrf_token %} {% if erro %}
          <div class="alert alert-danger" role="alert">{{ erro }}</div>
          {% endif %}

          <div class="mb-4 campo-wrapper">
            <label
              for="{{ form.codigo.id_for_label }}"
              class="form-label label-codigo"
            >
              {{ form.codigo.label }}
            </label>
            <div class="django-input-wrapper">{{ form.codigo }}</div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary botao-confirmar">
              Confirmar Código
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
